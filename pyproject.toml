[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atriai"
version = "0.1.0"
description = "Reproduction of the Helix VLA (Figure AI) architecture: System1/System2"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
vlm = ["transformers>=4.40", "accelerate>=0.30"]
sim = ["gymnasium>=0.29", "mujoco>=2.3"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
